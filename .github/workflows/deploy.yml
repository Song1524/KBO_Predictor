name: CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playball-production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kbo_predictor_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/kbo_predictor_test?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: test-root-password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate frontend Docker and bootstrap Nginx configuration
        run: |
          set -euo pipefail

          IMAGE_TAG=kbo-predictor-frontend-ci

          DB_PASSWORD=ci-placeholder \
            MYSQL_ROOT_PASSWORD=ci-placeholder \
            docker compose config --quiet

          docker build --tag "$IMAGE_TAG" frontend

          # Certificate-absent first deployment: HTTP + ACME bootstrap config.
          docker run --rm \
            --add-host backend:127.0.0.1 \
            "$IMAGE_TAG" nginx -t

  deploy:
    name: Deploy to EC2 with SSM
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs:
      - backend-test
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "AWS_REGION is empty"; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "AWS_ROLE_ARN is empty"; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo "EC2_INSTANCE_ID is empty"; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment command
        id: send-command
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT="$(cat <<'SCRIPT'
          set -e

          sudo -u ubuntu -H bash <<'DEPLOY_AS_UBUNTU'
          set -euo pipefail

          cd /home/ubuntu/KBO_Predictor

          MIN_ROOT_FREE_KB=$((2 * 1024 * 1024))
          BACKEND_ROLLBACK_IMAGE="kbo-predictor-backend:rollback"
          FRONTEND_ROLLBACK_IMAGE="kbo-predictor-frontend:rollback"

          print_root_disk_usage() {
            local label="$1"
            echo "=== ${label} ==="
            df -h /
          }

          print_container_health() {
            echo "=== Final container health ==="
            docker compose ps

            for service in db backend frontend; do
              local container_id
              local state
              local health
              container_id="$(docker compose ps -q "$service")"

              if [ -z "$container_id" ]; then
                echo "${service}: container not found"
                continue
              fi

              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' "$container_id")"
              echo "${service}: state=${state}, health=${health}"
            done
          }

          preserve_rollback_image() {
            local service="$1"
            local rollback_image="$2"
            local container_id
            local image_id

            container_id="$(docker compose ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "${service}: no running image to preserve for rollback."
              return
            fi

            image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
            docker image tag "$image_id" "$rollback_image"
            echo "${service}: preserved ${image_id} as ${rollback_image}."
          }

          print_root_disk_usage "Root disk usage before deployment"
          echo "=== Docker disk usage before deployment ==="
          docker system df

          ROOT_AVAILABLE_KB="$(df -Pk / | awk 'NR == 2 {print $4}')"
          if [ -z "$ROOT_AVAILABLE_KB" ] || ! [[ "$ROOT_AVAILABLE_KB" =~ ^[0-9]+$ ]]; then
            echo "Cannot determine available root disk space."
            exit 1
          fi
          if [ "$ROOT_AVAILABLE_KB" -lt "$MIN_ROOT_FREE_KB" ]; then
            echo "Insufficient root disk space before Docker build."
            echo "Available: ${ROOT_AVAILABLE_KB} KiB; required: ${MIN_ROOT_FREE_KB} KiB (2 GiB)."
            echo "Deployment stopped before changing containers or pruning rollback data."
            exit 1
          fi

          echo "=== Preserve current application images for one-step rollback ==="
          preserve_rollback_image backend "$BACKEND_ROLLBACK_IMAGE"
          preserve_rollback_image frontend "$FRONTEND_ROLLBACK_IMAGE"

          echo "=== Pull latest source ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Build Docker images ==="
          docker compose build backend frontend

          echo "=== Start database and backend ==="
          docker compose up -d db backend

          echo "=== Wait for backend ==="
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend health check passed."
              break
            fi

            if [ "$i" -eq 36 ]; then
              echo "Backend health check failed."
              docker compose ps
              docker compose logs --tail=150 backend
              exit 1
            fi

            sleep 5
          done

          echo "=== Start frontend ==="
          docker compose up -d --force-recreate frontend

          echo "=== Wait for frontend ==="
          FRONTEND_PORT_VALUE="$(
            docker compose port frontend 80 | head -n 1 | awk -F: '{print $NF}'
          )"
          if [ -z "$FRONTEND_PORT_VALUE" ]; then
            echo "Cannot determine the published frontend port."
            docker compose ps
            exit 1
          fi

          for i in $(seq 1 24); do
            if curl -fsS "http://127.0.0.1:${FRONTEND_PORT_VALUE}/healthz" > /dev/null; then
              echo "Frontend health check passed."
              break
            fi

            if [ "$i" -eq 24 ]; then
              echo "Frontend health check failed."
              docker compose ps
              docker compose logs --tail=150 frontend
              exit 1
            fi

            sleep 5
          done

          print_container_health

          print_root_disk_usage "Root disk usage before Docker cleanup"
          echo "=== Docker disk usage before cleanup ==="
          docker system df

          ROOT_USED_BEFORE_CLEANUP_KB="$(df -Pk / | awk 'NR == 2 {print $3}')"

          echo "=== Remove unused Docker build cache ==="
          docker builder prune --all --force

          echo "=== Remove dangling Docker images ==="
          # Deliberately omit --all so the two :rollback images remain available.
          docker image prune --force

          ROOT_USED_AFTER_CLEANUP_KB="$(df -Pk / | awk 'NR == 2 {print $3}')"
          ROOT_RECLAIMED_KB=$((ROOT_USED_BEFORE_CLEANUP_KB - ROOT_USED_AFTER_CLEANUP_KB))
          if [ "$ROOT_RECLAIMED_KB" -lt 0 ]; then
            ROOT_RECLAIMED_KB=0
          fi
          echo "Approximate root disk space reclaimed: ${ROOT_RECLAIMED_KB} KiB"

          print_root_disk_usage "Root disk usage after deployment and cleanup"
          echo "=== Docker disk usage after cleanup ==="
          docker system df

          print_container_health

          echo "=== Deployment completed ==="
          DEPLOY_AS_UBUNTU
          SCRIPT
          )"

          PARAMETERS="$(jq -n \
            --arg command "$DEPLOY_SCRIPT" \
            '{commands: [$command], executionTimeout: ["1800"]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy KBO_Predictor from GitHub Actions" \
            --timeout-seconds 1800 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          test -n "$COMMAND_ID" || { echo "SSM Command ID is empty"; exit 1; }
          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deployment result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          MAX_POLLS=186
          POLL_INTERVAL_SECONDS=10
          INVOCATION_JSON='{"Status":"Pending","StandardOutputContent":"","StandardErrorContent":"","ResponseCode":-1}'

          print_invocation() {
            echo "=== SSM invocation result ==="
            echo "Status: $(jq -r '.Status // "Unknown"' <<< "$INVOCATION_JSON")"
            echo "ResponseCode: $(jq -r '.ResponseCode // -1' <<< "$INVOCATION_JSON")"
            echo "=== StandardOutputContent ==="
            jq -r '.StandardOutputContent // ""' <<< "$INVOCATION_JSON"
            echo "=== StandardErrorContent ==="
            jq -r '.StandardErrorContent // ""' <<< "$INVOCATION_JSON"
          }

          for attempt in $(seq 1 "$MAX_POLLS"); do
            ERROR_FILE="$(mktemp)"
            set +e
            RESULT="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>"$ERROR_FILE")"
            RESULT_CODE=$?
            set -e

            if [ "$RESULT_CODE" -ne 0 ]; then
              if grep -q "InvocationDoesNotExist" "$ERROR_FILE"; then
                echo "SSM invocation is not visible yet (${attempt}/${MAX_POLLS})."
                rm -f "$ERROR_FILE"
                sleep "$POLL_INTERVAL_SECONDS"
                continue
              fi

              echo "Failed to query the SSM invocation."
              cat "$ERROR_FILE"
              rm -f "$ERROR_FILE"
              exit "$RESULT_CODE"
            fi
            rm -f "$ERROR_FILE"

            INVOCATION_JSON="$RESULT"
            STATUS="$(jq -r '.Status' <<< "$INVOCATION_JSON")"
            echo "SSM status: $STATUS (${attempt}/${MAX_POLLS})"

            case "$STATUS" in
              Success)
                print_invocation
                exit 0
                ;;
              Pending|InProgress|Delayed)
                sleep "$POLL_INTERVAL_SECONDS"
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                print_invocation
                exit 1
                ;;
              *)
                echo "Unexpected SSM status: $STATUS"
                print_invocation
                exit 1
                ;;
            esac
          done

          echo "SSM polling timed out after $((MAX_POLLS * POLL_INTERVAL_SECONDS)) seconds."
          print_invocation
          exit 1
