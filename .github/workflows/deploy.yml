name: CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playball-production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kbo_predictor_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/kbo_predictor_test?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: test-root-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build

    # PR에서는 테스트만 하고 실제 배포는 하지 않음
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            cd ~/KBO_Predictor

            echo "=== Pull latest source ==="
            git pull --ff-only origin main

            echo "=== Build and start containers ==="
            docker compose up -d --build --remove-orphans

            echo "=== Wait for application ==="
            for i in $(seq 1 36); do
              if curl -fsS http://localhost/actuator/health | grep -q '"status":"UP"'; then
                echo "Backend health check passed."
                break
              fi

              if [ "$i" -eq 36 ]; then
                echo "Backend health check failed."
                docker compose ps
                docker compose logs --tail=100 backend
                exit 1
              fi

              sleep 5
            done

            echo "=== Check frontend ==="
            curl -fsS http://localhost > /dev/null

            echo "=== Container status ==="
            docker compose ps
          EOF