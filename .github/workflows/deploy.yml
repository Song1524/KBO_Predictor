name: CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playball-production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kbo_predictor_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/kbo_predictor_test?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: test-root-password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY_HEX: ${{ secrets.EC2_SSH_KEY_HEX }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          CLEAN_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r\n ')"
          CLEAN_USER="$(printf '%s' "$EC2_USER" | tr -d '\r\n ')"
          CLEAN_KEY="$(printf '%s' "$EC2_SSH_KEY_HEX" | tr -d '\r\n ')"

          if [ -z "$CLEAN_HOST" ]; then
            echo "EC2_HOST is empty"
            exit 1
          fi

          if [ -z "$CLEAN_USER" ]; then
            echo "EC2_USER is empty"
            exit 1
          fi

          if [ -z "$CLEAN_KEY" ]; then
            echo "EC2_SSH_KEY_HEX is empty"
            exit 1
          fi

          if ! printf '%s' "$CLEAN_KEY" | grep -Eq '^[0-9a-fA-F]+$'; then
            echo "EC2_SSH_KEY_HEX contains invalid characters"
            exit 1
          fi

          export CLEAN_KEY

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = bytes.fromhex(os.environ["CLEAN_KEY"])
          Path.home().joinpath(".ssh/id_ed25519").write_bytes(key)
          PY

          chmod 600 "$HOME/.ssh/id_ed25519"

          if ! ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null 2>&1; then
            echo "Decoded EC2 SSH key is invalid"
            exit 1
          fi

          echo "CLEAN_EC2_HOST=$CLEAN_HOST" >> "$GITHUB_ENV"
          echo "CLEAN_EC2_USER=$CLEAN_USER" >> "$GITHUB_ENV"

          echo "SSH configuration completed."

      - name: Test EC2 network
        run: |
          echo "=== HTTP 80 ==="
          curl -v --connect-timeout 10 http://54.180.99.10/ || true

          echo "=== TCP 22 ==="
          nc -vz -w 10 54.180.99.10 22 || true

          echo "=== SSH 22 ==="
          ssh \
            -vvv \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@54.180.99.10 \
            "echo 'SSH connection successful'"

      - name: Deploy
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=accept-new \
            "$CLEAN_EC2_USER@$CLEAN_EC2_HOST" 'bash -se' <<'EOF'
          set -e

          cd "$HOME/KBO_Predictor"

          echo "=== Pull latest source ==="
          git pull --ff-only origin main

          echo "=== Build Docker images ==="
          docker compose build backend frontend

          echo "=== Start database and backend ==="
          docker compose up -d db backend

          echo "=== Wait for backend ==="
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend health check passed."
              break
            fi

            if [ "$i" -eq 36 ]; then
              echo "Backend health check failed."
              docker compose ps
              docker compose logs --tail=100 backend
              exit 1
            fi

            sleep 5
          done

          echo "=== Start frontend ==="
          docker compose up -d --force-recreate frontend

          echo "=== Wait for frontend ==="
          for i in $(seq 1 24); do
            if curl -fsS http://localhost > /dev/null; then
              echo "Frontend health check passed."
              break
            fi

            if [ "$i" -eq 24 ]; then
              echo "Frontend health check failed."
              docker compose ps
              docker compose logs --tail=100 frontend
              exit 1
            fi

            sleep 5
          done

          echo "=== Final container status ==="
          docker compose ps

          echo "=== Deployment completed ==="
          EOF