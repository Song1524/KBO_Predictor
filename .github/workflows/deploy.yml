name: CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playball-production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kbo_predictor_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/kbo_predictor_test?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: test-root-password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
            - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          CLEAN_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r\n ')"
          CLEAN_USER="$(printf '%s' "$EC2_USER" | tr -d '\r\n ')"

          if [ -z "$CLEAN_HOST" ]; then
            echo "EC2_HOST is empty"
            exit 1
          fi

          if [ -z "$CLEAN_USER" ]; then
            echo "EC2_USER is empty"
            exit 1
          fi

          printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "Decoded EC2 SSH key is invalid"
            exit 1
          fi

          echo "CLEAN_EC2_HOST=$CLEAN_HOST" >> "$GITHUB_ENV"
          echo "CLEAN_EC2_USER=$CLEAN_USER" >> "$GITHUB_ENV"

          echo "SSH configuration completed."

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=accept-new \
            "$CLEAN_EC2_USER@$CLEAN_EC2_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$CLEAN_EC2_USER@$CLEAN_EC2_HOST" << 'EOF'
            set -e

            cd ~/KBO_Predictor

            echo "=== Pull latest source ==="
            git pull --ff-only origin main

            echo "=== Build and start containers ==="
            docker compose up -d --build --remove-orphans

            echo "=== Wait for backend ==="
            for i in $(seq 1 36); do
              if curl -fsS http://localhost/actuator/health | grep -q '"status":"UP"'; then
                echo "Backend health check passed."
                break
              fi

              if [ "$i" -eq 36 ]; then
                echo "Backend health check failed."
                docker compose ps
                docker compose logs --tail=100 backend
                exit 1
              fi

              sleep 5
            done

            echo "=== Ensure frontend is running ==="
            docker compose up -d frontend

            echo "=== Wait for frontend ==="
            for i in $(seq 1 24); do
              if curl -fsS http://localhost > /dev/null; then
                echo "Frontend health check passed."
                break
              fi

              if [ "$i" -eq 24 ]; then
                echo "Frontend health check failed."
                docker compose ps
                docker compose logs --tail=100 frontend
                exit 1
              fi

              sleep 5
            done

            echo "=== Container status ==="
            docker compose ps
          EOF