name: CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playball-production
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kbo_predictor_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/kbo_predictor_test?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: test-root-password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2 with SSM
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs:
      - backend-test
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "AWS_REGION is empty"; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "AWS_ROLE_ARN is empty"; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo "EC2_INSTANCE_ID is empty"; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment command
        id: send-command
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT="$(cat <<'SCRIPT'
          set -e

          sudo -u ubuntu -H bash <<'DEPLOY_AS_UBUNTU'
          set -e

          cd /home/ubuntu/KBO_Predictor

          echo "=== Pull latest source ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Build Docker images ==="
          docker compose build backend frontend

          echo "=== Start database and backend ==="
          docker compose up -d db backend

          echo "=== Wait for backend ==="
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend health check passed."
              break
            fi

            if [ "$i" -eq 36 ]; then
              echo "Backend health check failed."
              docker compose ps
              docker compose logs --tail=150 backend
              exit 1
            fi

            sleep 5
          done

          echo "=== Start frontend ==="
          docker compose up -d --force-recreate frontend

          echo "=== Wait for frontend ==="
          FRONTEND_PORT_VALUE="$(
            docker compose port frontend 80 | head -n 1 | awk -F: '{print $NF}'
          )"
          if [ -z "$FRONTEND_PORT_VALUE" ]; then
            echo "Cannot determine the published frontend port."
            docker compose ps
            exit 1
          fi

          for i in $(seq 1 24); do
            if curl -fsS "http://127.0.0.1:${FRONTEND_PORT_VALUE}/healthz" > /dev/null; then
              echo "Frontend health check passed."
              break
            fi

            if [ "$i" -eq 24 ]; then
              echo "Frontend health check failed."
              docker compose ps
              docker compose logs --tail=150 frontend
              exit 1
            fi

            sleep 5
          done

          echo "=== Final container status ==="
          docker compose ps

          echo "=== Deployment completed ==="
          DEPLOY_AS_UBUNTU
          SCRIPT
          )"

          PARAMETERS="$(jq -n \
            --arg command "$DEPLOY_SCRIPT" \
            '{commands: [$command], executionTimeout: ["1800"]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy KBO_Predictor from GitHub Actions" \
            --timeout-seconds 1800 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          test -n "$COMMAND_ID" || { echo "SSM Command ID is empty"; exit 1; }
          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deployment result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          MAX_POLLS=186
          POLL_INTERVAL_SECONDS=10
          INVOCATION_JSON='{"Status":"Pending","StandardOutputContent":"","StandardErrorContent":"","ResponseCode":-1}'

          print_invocation() {
            echo "=== SSM invocation result ==="
            echo "Status: $(jq -r '.Status // "Unknown"' <<< "$INVOCATION_JSON")"
            echo "ResponseCode: $(jq -r '.ResponseCode // -1' <<< "$INVOCATION_JSON")"
            echo "=== StandardOutputContent ==="
            jq -r '.StandardOutputContent // ""' <<< "$INVOCATION_JSON"
            echo "=== StandardErrorContent ==="
            jq -r '.StandardErrorContent // ""' <<< "$INVOCATION_JSON"
          }

          for attempt in $(seq 1 "$MAX_POLLS"); do
            ERROR_FILE="$(mktemp)"
            set +e
            RESULT="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>"$ERROR_FILE")"
            RESULT_CODE=$?
            set -e

            if [ "$RESULT_CODE" -ne 0 ]; then
              if grep -q "InvocationDoesNotExist" "$ERROR_FILE"; then
                echo "SSM invocation is not visible yet (${attempt}/${MAX_POLLS})."
                rm -f "$ERROR_FILE"
                sleep "$POLL_INTERVAL_SECONDS"
                continue
              fi

              echo "Failed to query the SSM invocation."
              cat "$ERROR_FILE"
              rm -f "$ERROR_FILE"
              exit "$RESULT_CODE"
            fi
            rm -f "$ERROR_FILE"

            INVOCATION_JSON="$RESULT"
            STATUS="$(jq -r '.Status' <<< "$INVOCATION_JSON")"
            echo "SSM status: $STATUS (${attempt}/${MAX_POLLS})"

            case "$STATUS" in
              Success)
                print_invocation
                exit 0
                ;;
              Pending|InProgress|Delayed)
                sleep "$POLL_INTERVAL_SECONDS"
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                print_invocation
                exit 1
                ;;
              *)
                echo "Unexpected SSM status: $STATUS"
                print_invocation
                exit 1
                ;;
            esac
          done

          echo "SSM polling timed out after $((MAX_POLLS * POLL_INTERVAL_SECONDS)) seconds."
          print_invocation
          exit 1
