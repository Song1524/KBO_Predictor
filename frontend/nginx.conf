map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name playball.ai.kr;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Keep Docker/CD health probes independent of the public redirect.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://playball.ai.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name playball.ai.kr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/playball.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playball.ai.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PLAYBALL_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/playball/common-locations.conf;
}
