map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Bootstrap configuration used until the first Let's Encrypt certificate exists.
server {
    listen 80;
    server_name playball.ai.kr;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/playball/common-locations.conf;
}
