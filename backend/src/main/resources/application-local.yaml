spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kbo_predictor?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    placeholders:
      removeLegacyTestUser: false

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        secure: false
        same-site: lax

app:
  web:
    cors:
      allowed-origins: ${APP_FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
